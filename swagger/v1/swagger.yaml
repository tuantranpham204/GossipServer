---
openapi: 3.0.1
info:
  title: Gossip Server API
  version: v1
paths:
  "/api/v1/users/sign_up":
    post:
      summary: Sign Up
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: successful
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    username:
                      type: string
                    email:
                      type: string
                      default: 12a1tranphamtuan69@gmail.com
                    password:
                      type: string
                      default: Tuan08/05/2004
                    password_confirmation:
                      type: string
                      default: Tuan08/05/2004
                    name:
                      type: string
                    surname:
                      type: string
                    gender:
                      type: integer
                      default: 1
                    dob:
                      type: string
                      format: date
                      example: '2000-01-01'
                  required:
                  - username
                  - email
                  - password
                  - password_confirmation
                  - name
                  - surname
                  - gender
                  - dob
  "/api/v1/users/sign_in":
    post:
      summary: Sign In
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: successful
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      default: 12a1tranphamtuan69@gmail.com
                    password:
                      type: string
                      default: Tuan08/05/2004
                  required:
                  - email
                  - password
  "/api/v1/users/sign_out":
    delete:
      summary: Sign Out
      tags:
      - Authentication
      responses:
        '401':
          description: unauthorized
  "/api/v1/notifications/show_by_user":
    get:
      summary: Show notifications by current user
      tags:
      - Notifications
      security:
      - Bearer: []
      parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Items per page
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: notifications found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                        actor_id:
                          type: integer
                        actor_username:
                          type: string
                        actor_avatar_url:
                          type: string
                          nullable: true
                        status:
                          type: integer
                        notifiable_type:
                          type: integer
                        content:
                          type: object
                        updated_at:
                          type: string
                          format: date_time
                        created_at:
                          type: string
                          format: date_time
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
                      per_page:
                        type: integer
  "/api/v1/notifications/read/{id}":
    patch:
      summary: Read a notification
      tags:
      - Notifications
      security:
      - Bearer: []
      parameters:
      - name: id
        in: path
        description: Notification ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: notification read
  "/api/v1/notifications/read_all":
    patch:
      summary: Read all notifications
      tags:
      - Notifications
      security:
      - Bearer: []
      responses:
        '200':
          description: all notifications read
  "/api/v1/profiles/search":
    get:
      summary: Searches users by username or full name
      tags:
      - Profiles
      security:
      - Bearer: []
      parameters:
      - name: q
        in: query
        description: Search term (username, first name, last name, full name, reversed
          full name)
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Items per page
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: search results found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                        username:
                          type: string
                        email:
                          type: string
                          nullable: true
                        name:
                          type: string
                        surname:
                          type: string
                        bio:
                          type: string
                          nullable: true
                        dob:
                          type: string
                          format: date
                          nullable: true
                        gender:
                          type: string
                          nullable: true
                        relationship_status:
                          type: string
                          nullable: true
                        status:
                          type: string
                          nullable: true
                        avatar_url:
                          type: string
                          nullable: true
                        bg_img_url:
                          type: string
                          nullable: true
                        followers_amt:
                          type: integer
                        following_amt:
                          type: integer
                        is_email_public:
                          type: boolean
                        is_gender_public:
                          type: boolean
                        is_rel_status_public:
                          type: boolean
                        friend_status:
                          type: string
                        follow_status:
                          type: string
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      next_page:
                        type: integer
                        nullable: true
                      prev_page:
                        type: integer
                        nullable: true
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
                      per_page:
                        type: integer
  "/api/v1/profiles/{id}":
    get:
      summary: Show a specific profile
      tags:
      - Profiles
      security:
      - Bearer: []
      parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: profile found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      capacity:
                        type: string
                      user_id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                        nullable: true
                      name:
                        type: string
                      surname:
                        type: string
                      bio:
                        type: string
                        nullable: true
                      dob:
                        type: string
                        format: date
                        nullable: true
                      gender:
                        type: string
                        nullable: true
                      relationship_status:
                        type: string
                        nullable: true
                      status:
                        type: string
                        nullable: true
                      avatar_url:
                        type: string
                        nullable: true
                      bg_img_url:
                        type: string
                        nullable: true
                      is_email_public:
                        type: boolean
                      is_gender_public:
                        type: boolean
                      is_rel_status_public:
                        type: boolean
                      followers_amt:
                        type: integer
                      following_amt:
                        type: integer
                      friend_status:
                        type: string
                      follow_status:
                        type: string
  "/api/v1/profiles/update":
    patch:
      summary: Update a specific profile
      tags:
      - Profiles
      security:
      - Bearer: []
      parameters: []
      responses:
        '200':
          description: profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                        nullable: true
                      name:
                        type: string
                      surname:
                        type: string
                      bio:
                        type: string
                        nullable: true
                      dob:
                        type: string
                        format: date
                        nullable: true
                      gender:
                        type: string
                        nullable: true
                      relationship_status:
                        type: string
                        nullable: true
                      is_email_public:
                        type: boolean
                      is_gender_public:
                        type: boolean
                      is_rel_status_public:
                        type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                surname:
                  type: string
                bio:
                  type: string
                dob:
                  type: string
                  format: date
                gender:
                  type: integer
                  default: 1
                relationship_status:
                  type: integer
                  default: 0
                is_email_public:
                  type: boolean
                  default: false
                is_gender_public:
                  type: boolean
                  default: true
                is_rel_status_public:
                  type: boolean
                  default: true
              required:
              - name
              - surname
              - bio
              - dob
              - gender
              - relationship_status
              - is_email_public
              - is_gender_public
              - is_rel_status_public
  "/api/v1/profiles/update_images/{type}":
    patch:
      summary: Update profile images
      tags:
      - Profiles
      security:
      - Bearer: []
      parameters:
      - name: type
        in: path
        description: Image type (avatar, background image)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: profile images updated
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
  "/api/v1/profiles/get_images/{type}/{user_id}":
    get:
      summary: Get profile images
      tags:
      - Profiles
      security:
      - Bearer: []
      parameters:
      - name: type
        in: path
        description: Image type (avatar, background image)
        required: true
        schema:
          type: string
      - name: user_id
        in: path
        description: User ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: profile images retrieved
  "/api/v1/rooms/private/show/{status}":
    get:
      summary: Show private rooms
      tags:
      - Rooms
      security:
      - Bearer: []
      parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Items per page
        required: false
        schema:
          type: integer
      - name: status
        in: path
        description: Room status
        required: true
        schema:
          type: string
      responses:
        '200':
          description: private rooms found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        room_type:
                          type: string
                        created_at:
                          type: string
                          format: date_time
                        updated_at:
                          type: string
                          format: date_time
                        opponent:
                          type: object
                          properties:
                            participant_id:
                              type: integer
                            user_id:
                              type: integer
                            role:
                              type: string
                            avatar_url:
                              type: string
                            name:
                              type: string
                            surname:
                              type: string
                            username:
                              type: string
                  meta:
                    type: object
                    properties:
                      total_pages:
                        type: integer
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
  "/api/v1/rooms/private/request/{receiver_id}":
    post:
      summary: Request a private room
      tags:
      - Rooms
      security:
      - Bearer: []
      parameters:
      - name: receiver_id
        in: path
        description: Receiver ID
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: private room requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      room_type:
                        type: string
                      created_at:
                        type: string
                        format: date_time
                      updated_at:
                        type: string
                        format: date_time
                      participants:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            room_id:
                              type: integer
                            user_id:
                              type: integer
                            created_at:
                              type: string
                              format: date_time
                            updated_at:
                              type: string
                              format: date_time
                  message:
                    type: string
  "/api/v1/rooms/private/accept/{room_id}":
    patch:
      summary: Accept a private room request
      tags:
      - Rooms
      security:
      - Bearer: []
      parameters:
      - name: room_id
        in: path
        description: Room ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: private room accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  "/api/v1/rooms/private/decline/{room_id}":
    patch:
      summary: Decline a private room request
      tags:
      - Rooms
      security:
      - Bearer: []
      parameters:
      - name: room_id
        in: path
        description: Room ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: private room declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
